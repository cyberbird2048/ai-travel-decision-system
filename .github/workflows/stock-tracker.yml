name: stock-tracker

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 每个交易日 UTC 22:00 每日扫描（美股收盘后）
    - cron: '0 0 * * 6'      # 每周六 UTC 00:00 周报
  workflow_dispatch:
    inputs:
      task:
        description: 'daily_scan | weekly_report | quarterly_review'
        default: 'daily_scan'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: stock-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Decide task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ github.event.inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * 6" ]; then
            echo "task=weekly_report" >> "$GITHUB_OUTPUT"
          else
            echo "task=daily_scan" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m src.${{ steps.task.outputs.task }}
      - name: Commit dossier updates
        run: |
          cd ..
          git config user.name "stock-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stock-tracker/stocks stock-tracker/reports
          git diff --cached --quiet || git commit -m "chore(stock-tracker): ${{ steps.task.outputs.task }} $(date -u +%F)"
          git push
