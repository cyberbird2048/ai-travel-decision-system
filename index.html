<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17352b" />
    <meta name="description" content="根据香港实时天气，判断指定日期和出行活动是否适合。" />
    <title>出行适配度 · 天气决策</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top">出行适配度 <span>WEATHER FIT</span></a>
      <div class="connection" id="connection"><i></i><span>读取天气中</span></div>
    </header>

    <main id="top">
      <section class="query-panel" aria-labelledby="query-title">
        <div>
          <p class="eyebrow">Before you go</p>
          <h1 id="query-title">这个时间去做这件事，<br />合不合适？</h1>
        </div>
        <form id="trip-form">
          <label>
            <span>目的地</span>
            <select id="destination" name="destination">
              <option value="Hong Kong">香港</option>
            </select>
          </label>
          <label>
            <span>出行类型</span>
            <select id="activity" name="activity">
              <option value="hiking">山径徒步</option>
              <option value="camping">露营过夜</option>
              <option value="city">城市漫游</option>
              <option value="food">美食探店</option>
              <option value="beach">海滩活动</option>
            </select>
          </label>
          <label>
            <span>开始日期</span>
            <input id="start-date" name="startDate" type="date" />
          </label>
          <label>
            <span>结束日期</span>
            <input id="end-date" name="endDate" type="date" />
          </label>
          <button id="refresh-button" type="button">重新评估</button>
        </form>
      </section>

      <section class="result-panel" aria-live="polite">
        <div class="score-block">
          <div class="score-ring" id="score-ring">
            <strong id="score-value">--</strong><small>/100</small>
          </div>
          <div class="score-copy">
            <p id="activity-label">山径徒步适配度</p>
            <h2 id="verdict-title">正在读取官方天气</h2>
            <p id="verdict-summary">将结合降雨、雷暴、风力、高温和天气警告进行判断。</p>
          </div>
          <span class="verdict-badge" id="verdict-badge">CALCULATING</span>
        </div>

        <div class="weather-days" id="weather-days"></div>

        <div class="decision-grid">
          <section>
            <div class="section-title"><span>01</span><h3>关键风险</h3></div>
            <div class="risk-list" id="risk-list"></div>
          </section>
          <section>
            <div class="section-title"><span>02</span><h3>怎么调整</h3></div>
            <div class="advice-list" id="advice-list"></div>
          </section>
        </div>
      </section>

      <section class="rule-note">
        <strong>判断原则</strong>
        <p>官方警告与安全阈值优先于行程沉没成本。结果用于辅助决策，出发前仍需复查现场状况。</p>
        <a href="https://www.hko.gov.hk/" target="_blank" rel="noreferrer">查看香港天文台 ↗</a>
      </section>
    </main>

    <footer><span>数据源：香港天文台开放数据</span><span id="updated-at">尚未更新</span></footer>

    <script src="adapters/hko-weather.js"></script>
    <script src="app.js"></script>
  </body>
</html>
